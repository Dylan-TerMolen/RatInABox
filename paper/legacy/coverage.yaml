# Figures that were in the manuscript draft (d1, as of 2026-09-23) before the paper/
# pipeline took over. They were removed from the Word doc, so every one of them must
# be regenerated by the pipeline -- nothing here may silently go missing.
#
# Each entry maps an archived image to the figure id + panel(s) that replace it.
# `python -m paper.build <id> --check` should list any entry for that figure whose
# panels aren't built yet as "LEGACY NOT YET REGENERATED" (a warning, not a failure).
# When all of an entry's panels exist, set `regenerated: true`.
#
# kind: figure     -> must be regenerated
#       superseded -> an older draft of another entry; covered when that entry is
#       reference  -> not ours (source-paper example); informs styling, not regenerated

legacy:
  - file: setup_trajectory_time_AB.png
    kind: figure
    figure: setup
    panels: [trajectory_time_A, trajectory_time_B]
    note: continuous line colored by elapsed time; env A rectangle + env B oval
    regenerated: true           # both envs built in setup.py row 1 (2026-09-23)

  - file: setup_trajectory_time_AB_scatter_old.png
    kind: superseded
    superseded_by: setup_trajectory_time_AB.png

  - file: setup_trajectory_phase_AB.png
    kind: figure
    figure: setup
    panels: [trajectory_phase_A, trajectory_phase_B]
    regenerated: true           # both envs built in setup.py row 2 (2026-09-23);
                                 # also fixed the "post" mislabeling (now genuinely
                                 # 850-2000ms, inter-trial rest is its own unlabeled layer)

  - file: reference_source_paper_tEBC_vs_nontEBC.png
    kind: reference
    note: >
      Hannah's example from the source paper ("Perhaps we want something like this also
      to show where the task is taking place"): separate non-tEBC (gray) and tEBC
      (phase-colored) trajectory panels. Support this as an option on trajectory_phase.

  - file: setup_place_centres_AB.png
    kind: figure
    figure: setup
    panels: [place_centres_A, place_centres_B]
    note: field-centre scatter, e.g. "53/132 place cells" -- regenerate at bioreal (20%)
    regenerated: false  # was built in setup.py rows 2-3 (2026-09-23; bioreal gives 26/132 /
                         # 20%, not 53/132 -- that was the old 0.4 figure), but the panel
                         # was dropped from the setup figure in the 2026-10-23 review
                         # (place_coverage's heatmap + outlines already covers field
                         # density/location; the plain centre scatter was deemed
                         # redundant). Flipped back to false -- not re-deleted -- so
                         # --check keeps warning and Cowork keeps this legacy image
                         # pending until the authors decide to cut it for good.

  - file: setup_place_coverage_tiled_AB.png
    kind: figure
    figure: setup
    panels: [place_coverage_A, place_coverage_B]
    note: summed-field heatmap with per-field outlines
    regenerated: true  # built in setup.py row 3 (2026-09-23); heatmap and outlines
                        # both clipped to the boundary polygon (fixes the pre-existing
                        # "circles spill past the wall" bug this same note used to describe)

  - file: setup_example_fields_A.png
    kind: figure
    figure: setup
    panels: [example_fields_A]
    note: 3 individual fields, env A (radius 0.135 m / diameter 0.270 m)
    regenerated: true  # built in setup.py row 4 (2026-09-23); actual width 0.1350 m,
                        # matches this note exactly. 2026-10-23: cut from 6 to 3 fields,
                        # chosen by farthest-point sampling for spatial distinctness.

  - file: setup_example_fields_B.png
    kind: figure
    figure: setup
    panels: [example_fields_B]
    note: 3 individual fields, env B (radius 0.104 m / diameter 0.207 m)
    regenerated: true  # built in setup.py row 5 (2026-09-23); actual width 0.1037 m,
                        # matches this note exactly. 2026-10-23: cut from 6 to 3 fields,
                        # chosen by farthest-point sampling for spatial distinctness.

  - file: setup_example_fields_A_old_width.png
    kind: superseded
    superseded_by: setup_example_fields_A.png

  - file: setup_example_fields_B_old_width.png
    kind: superseded
    superseded_by: setup_example_fields_B.png

  - file: models_independent_field_grid.png
    kind: figure
    figure: models
    panels: [independent_field_grid]
    note: titled "Additive model" (legacy name = IM); in / near-edge / out-of-field per type
    regenerated: true  # built in figures/models.py panel c (2026-09-23)

  - file: models_place_dependent_field_grid.png
    kind: figure
    figure: models
    panels: [place_dependent_field_grid]
    note: titled "Dependent model" (legacy name = PDM)
    regenerated: true  # built in figures/models.py panel d (2026-09-23)

  - file: models_arousal_mediated_2x2.png
    kind: figure
    figure: models
    panels: [arousal_mediated_2x2_grid]
    note: (in/out of field) x (running/sitting), cf. Shan et al. 2016 Fig 3A/B
    regenerated: true  # built in figures/models.py panel e (2026-09-23); fixed a
                        # fidelity bug where the raw response delta was plotted
                        # without adding back the cell's ongoing baseline rate
