{% extends "base.html" %}
{% block content %}
<h2>Upload existing .sh</h2>
<p class="muted">For scripts you've already written by hand, or ones the auto-generator doesn't cover yet.
   This is submitted to Quest exactly as uploaded -- no templating.</p>

<form method="post" action="/jobs/new-raw" enctype="multipart/form-data" class="card">
  <div class="field">
    <label>Job name</label>
    <input type="text" name="job_name" required>
  </div>
  <div class="field">
    <label>Repo</label>
    <select name="repo">
      <option value="ratinabox">ratinabox</option>
      <option value="hannahs_cebras">hannahs_cebras</option>
    </select>
  </div>
  <div class="field">
    <label>.sh file</label>
    <input type="file" name="sh_file" accept=".sh" required>
  </div>
  <button class="btn" type="submit">Save</button>
</form>
{% endblock %}
