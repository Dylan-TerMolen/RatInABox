# Local config for the Quest job runner web UI.
# Nothing here is a secret (no password/key contents, just a path to your
# existing key file) so this is safe to commit -- auth relies entirely on
# your existing `~/.ssh/slurm_pk` key, same as the `slurm` alias / `slurmresults`
# function in ~/.zshrc.

quest:
  host: "quest.it.northwestern.edu"
  username: "tfl2886"
  # Path to the private key `slurm`/`slurmresults` already use -- never
  # copied anywhere, just referenced via `ssh -i`.
  identity_file: "~/.ssh/slurm_pk"

# One entry per repo this tool can generate/submit jobs for. Just ratinabox --
# hannahs-cebras is a decoding utility library that hsw/main.py imports
# (installed as the `hannahs_cebras` pip package on Quest), not something we
# submit jobs to or need scripts/params for. local_path is where the repo
# lives on THIS machine (the one running the web UI); remote_path is where
# it lives on Quest.
repos:
  ratinabox:
    local_path: "/Users/dylantermolen/Projects/RatInABox"
    remote_path: "/home/tfl2886/projects/RatInABox"
    # Real existing convention (ratinabox/hsw/config.py's get_save_directory())
    # -- main.py always writes here itself, regardless of cwd.
    results_subdir: "saved/results"

# Per-script form scoping. Params not listed here still work exactly as
# before (the script's own default applies, flag simply isn't passed) -- they
# just aren't rendered as inputs, to keep the form short for scripts with a
# lot of rarely-changed params. Required params with no default (e.g.
# model_type) are always shown regardless of this list, since the command
# can't be built without them. A script id with no entry here shows every
# detected param (unscoped) -- add an entry as you find a script worth
# trimming down.
script_forms:
  "ratinabox:hsw_main":
    # Distribution-type (*_dist/*_distribution) and *_std params are hidden
    # by default -- they fall back to their argparse default ('fixed'/0.1),
    # which already matches every hand-written sweep script's convention.
    visible_params:
      - experiment
      - holdovers
      - percent_task_responsive_cells
      - percent_place_cells
      - percent_task_in_response_values

# Defaults pre-filled into the SLURM header when generating a new script. All
# overridable per-job in the UI.
slurm_defaults:
  account: "p32072"
  partition: "gengpu"
  gres: "gpu:a100:1"
  nodes: 1
  ntasks: 1
  mem: "32GB"
  time: "12:00:00"
  mail_type: "END,FAIL"
  mail_user: "dptermolen@gmail.com"
  conda_env: "ratinabox"

# Local paths (on this machine) used by the app itself.
app:
  db_path: "webui/data/jobs.db"
  generated_scripts_dir: "webui/data/generated"
  uploads_dir: "webui/data/uploads"
